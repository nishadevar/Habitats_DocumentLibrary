<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>habitats | My Requests</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app">
  <div id="sidebar-root"></div>

  <main class="main">
    <div id="header-root"></div>

    <div class="toolbar">
      <label class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" placeholder="Search Query">
      </label>
      <button class="chip chip-all">All 0</button>
      <button class="chip chip-pending">Pending 0</button>
      <button class="chip chip-approved">Approved 0</button>
      <button class="chip chip-rejected">Rejected 0</button>
      <button class="chip chip-deletion">Deletion Submitted 0</button>
      <button class="chip chip-deleted">Deleted 0</button>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Request ID</th><th>Plan</th><th>Type</th><th>Status</th>
            <th>Submitted at</th><th>Last Updated</th><th>Reviewer</th><th>Feedback</th>
          </tr>
        </thead>
        <tbody>
          <tr class="empty-row"><td colspan="8">No requests found</td></tr>
        </tbody>
      </table>
      <div class="table-footer">
        <div class="rows-select">Rows per page: <select><option>10</option><option>25</option><option>50</option></select></div>
        <span>0–0 of 0</span>
        <span class="pager-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></span>
        <span class="pager-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
    </div>

    <div class="footnote">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>
      <span>Rejected submissions include feedback. Click a request to review details or make edits and resubmit.</span>
    </div>
  </main>
</div>
<script src="assets/shell.js"></script>
<script>initShell('my-requests', 'My Requests');</script>
</body>
</html>
